name: Deploy complete system

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production
  cancel-in-progress: false

jobs:
  deploy:
    name: Firebase Hosting, Functions, and RTDB rules
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: production
    env:
      VITE_FIREBASE_API_KEY: ${{ secrets.VITE_FIREBASE_API_KEY }}
      VITE_FIREBASE_AUTH_DOMAIN: ${{ secrets.VITE_FIREBASE_AUTH_DOMAIN }}
      VITE_FIREBASE_PROJECT_ID: ${{ secrets.VITE_FIREBASE_PROJECT_ID }}
      VITE_FIREBASE_STORAGE_BUCKET: ${{ secrets.VITE_FIREBASE_STORAGE_BUCKET }}
      VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.VITE_FIREBASE_MESSAGING_SENDER_ID }}
      VITE_FIREBASE_APP_ID: ${{ secrets.VITE_FIREBASE_APP_ID }}
      VITE_FIREBASE_DATABASE_URL: ${{ secrets.VITE_FIREBASE_DATABASE_URL }}
      VITE_GIT_SHA: ${{ github.sha }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Validate deployment configuration
        env:
          GOOGLE_CREDENTIALS: ${{ secrets.GOOGLE_CREDENTIALS }}
        run: |
          required=(
            GOOGLE_CREDENTIALS
            VITE_FIREBASE_API_KEY
            VITE_FIREBASE_AUTH_DOMAIN
            VITE_FIREBASE_PROJECT_ID
            VITE_FIREBASE_STORAGE_BUCKET
            VITE_FIREBASE_MESSAGING_SENDER_ID
            VITE_FIREBASE_APP_ID
            VITE_FIREBASE_DATABASE_URL
          )
          for name in "${required[@]}"; do
            if [ -z "${!name}" ]; then
              echo "Missing required production secret: ${name}" >&2
              exit 1
            fi
          done

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: |
            package-lock.json
            functions/package-lock.json

      - name: Install dependencies
        run: |
          npm ci
          npm ci --prefix functions

      - name: Check and build entire system
        run: |
          npm run check
          npm run build --prefix functions
          npm run build

      - name: Create deployment provenance
        env:
          ALERT_WEBHOOK_URL: ${{ secrets.ALERT_WEBHOOK_URL }}
        run: |
          umask 077
          echo "BUILD_GIT_SHA=${GITHUB_SHA}" > "functions/.env.${VITE_FIREBASE_PROJECT_ID}"
          echo "DATABASE_RULES_GIT_SHA=${GITHUB_SHA}" >> "functions/.env.${VITE_FIREBASE_PROJECT_ID}"
          if [ -n "${ALERT_WEBHOOK_URL}" ]; then
            echo "ALERT_WEBHOOK_URL=${ALERT_WEBHOOK_URL}" >> "functions/.env.${VITE_FIREBASE_PROJECT_ID}"
          fi

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          credentials_json: ${{ secrets.GOOGLE_CREDENTIALS }}
          project_id: ${{ secrets.VITE_FIREBASE_PROJECT_ID }}

      - name: Deploy Hosting, Functions, and RTDB rules from the same commit
        run: npx firebase deploy --project "${VITE_FIREBASE_PROJECT_ID}" --only hosting,functions,database
