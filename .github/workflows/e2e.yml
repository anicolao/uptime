name: Verify

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    name: Check, build, and E2E
    runs-on: macos-latest
    timeout-minutes: 30
    env:
      CI: "1"
      BUILD_GIT_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      DATABASE_RULES_GIT_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      VITE_GIT_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      VITE_FIREBASE_API_KEY: test-api-key
      VITE_FIREBASE_AUTH_DOMAIN: demo-antigravity-uptime.firebaseapp.com
      VITE_FIREBASE_PROJECT_ID: demo-antigravity-uptime
      VITE_FIREBASE_STORAGE_BUCKET: demo-antigravity-uptime.appspot.com
      VITE_FIREBASE_MESSAGING_SENDER_ID: "123456789"
      VITE_FIREBASE_APP_ID: 1:123456789:web:test
      VITE_FIREBASE_DATABASE_URL: https://demo-antigravity-uptime.firebaseio.com
      VITE_FIREBASE_USE_EMULATORS: "true"
      VITE_FUNCTIONS_BASE_URL: http://127.0.0.1:5001/demo-antigravity-uptime/us-central1

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: |
            package-lock.json
            functions/package-lock.json

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Install dependencies
        run: |
          npm ci
          npm ci --prefix functions

      - name: Install browser
        run: npx playwright install chromium

      - name: Check and build entire system
        run: |
          npm run check
          npm run build --prefix functions
          npm run build

      - name: Run emulator E2E tests
        run: npx firebase emulators:exec --only auth,database,functions --project demo-antigravity-uptime "npx playwright test"

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 30

      - name: Upload failed test results
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: test-results
          path: test-results/
          retention-days: 30
